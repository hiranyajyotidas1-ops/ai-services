<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>About — Clevora</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
  <div id="app"></div>
  <script src="js/app.js"></script>
  <script>
    window.Clevora.mountShell(`
      <section class="section">
        <div class="container" style="max-width:36rem">
          <h1 style="margin:0;font-size:clamp(2rem,4vw,2.75rem)">About Clevora</h1>
          <p style="margin:1.5rem 0 0;color:var(--muted);line-height:1.65">
            Clevora is an India-first AI services desk. We sell finished work — articles, brands, websites, research — at a one-time price, then generate it on your desk.
          </p>
          <p style="margin:1rem 0 0;line-height:1.65">
            The shop is built like a restaurant: a menu you can read before you sit down, a kitchen that does not improvise the bill, and a table (your desk) where the plate arrives.
          </p>
          <p style="margin:1rem 0 0;line-height:1.65">
            We study how Linear, Stripe, Framer and Lovable present product: quiet type, one accent, no carnival. Then we price for UPI and rupees.
          </p>
        </div>
      </section>
    `);
  </script>
</body>
</html>
