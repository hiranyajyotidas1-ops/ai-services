<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Clevora — AI services for everyone</title>
  <meta name="description" content="Content, design, websites, research and scripts. One-time prices from ₹29. India-first AI desk."/>
  <meta name="theme-color" content="#6366f1"/>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
  <div class="bg-blob b1"></div>
  <div class="bg-blob b2"></div>
  <div class="bg-blob b3"></div>
  <div id="app"></div>
  <script src="js/app.js"></script>
  <script>
    (function () {
      const C = window.Clevora;
      const prefs = C.getPrefs();
      const country = prefs.country;

      const serviceCards = C.SERVICES.slice(0, 6)
        .map(
          (s) => "
        <a class="card" href="service.html?slug=" + s.slug + "">
          <div class="card-cat">" + C.escapeHtml(s.category) + "</div>
          <h3>" + C.escapeHtml(s.title) + "</h3>
          <p>" + C.escapeHtml(s.blurb) + "</p>
          <div class="card-price">" + C.formatPrice(s.priceInr, country) + "</div>
        </a>"
        )
        .join("");

      const planCards = C.PLANS.map(
        (p) => "
        <div class="price-card " + (p.featured ? "featured" : "") + "">
          <div class="price-name">" + C.escapeHtml(p.name) + "</div>
          <div class="price-amount">" + C.formatPrice(p.priceInr, country) + "</div>
          <p class="price-note">" + C.escapeHtml(p.note) + "</p>
          <ul class="price-list">" + p.items.map((i) => "<li>" + C.escapeHtml(i) + "</li>").join("") + "</ul>
          <a class="btn btn-primary btn-block" href="signup.html">Choose " + C.escapeHtml(p.name) + "</a>
        </div>"
      ).join("");

      C.mountShell("
        <section class="hero">
          <div class="container">
            <p class="eyebrow">" + C.t("live") + "</p>
            <h1>" + C.t("hero") + "</h1>
            <p class="hero-lead">" + C.t("heroBody") + "</p>
            <div class="hero-actions">
              <a class="btn btn-primary" href="signup.html">" + C.t("start") + "</a>
              <a class="btn btn-secondary" href="services.html">" + C.t("seeServices") + "</a>
            </div>
            <p class="guarantee">" + C.t("guarantee") + "</p>
          </div>
        </section>

        <section class="stats">
          <div class="container stats-grid">
            <div><div class="stat-value">9</div><div class="stat-label">Services</div></div>
            <div><div class="stat-value">12</div><div class="stat-label">Languages</div></div>
            <div><div class="stat-value">" + C.formatPrice(29, country) + "</div><div class="stat-label">Starts at</div></div>
            <div><div class="stat-value">30d</div><div class="stat-label">Refund window</div></div>
          </div>
        </section>

        <section class="section">
          <div class="container">
            <div class="section-head">
              <h2>" + C.t("services") + "</h2>
              <a class="link-all" href="services.html">All →</a>
            </div>
            <div class="grid-3">" + serviceCards + "</div>
          </div>
        </section>

        <section class="how">
          <div class="container">
            <h2>" + C.t("how") + "</h2>
            <div class="how-grid">
              <div><div class="how-num">01</div><h3>Preview</h3><p>Read the offer. No account required.</p></div>
              <div><div class="how-num">02</div><h3>Brief</h3><p>Name the job in your language.</p></div>
              <div><div class="how-num">03</div><h3>Build</h3><p>The desk writes, designs or codes.</p></div>
              <div><div class="how-num">04</div><h3>Keep</h3><p>Download from your desk. Revise if needed.</p></div>
            </div>
          </div>
        </section>

        <section class="section">
          <div class="container">
            <div class="section-head"><h2>" + C.t("pricing") + "</h2></div>
            <div class="price-grid">" + planCards + "</div>
          </div>
        </section>
      ");
    })();
  </script>
</body>
</html>
