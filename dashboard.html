<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Desk — Clevora</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
  <div id="app"></div>
  <script src="js/app.js"></script>
  <script>
    (function () {
      const C = window.Clevora;
      const user = C.getUser();
      if (!user) {
        location.href = "login.html?next=dashboard.html";
        return;
      }
      const country = C.getPrefs().country;
      const orders = C.getOrders().filter((o) => o.userEmail === user.email);

      const list =
        orders.length === 0
          ? `<p style="color:var(--muted);font-size:.875rem">No jobs yet. Browse services or the store.</p>`
          : orders
              .map(
                (o) => `
          <article class="order-item" data-id="${o.id}">
            <h3>${C.escapeHtml(o.title)}</h3>
            <p class="order-meta">${C.escapeHtml(o.status)} · ${C.formatPrice(o.amountInr, country)} · ${new Date(o.createdAt).toLocaleString()}</p>
            <div class="order-actions">
              ${
                o.deliverable
                  ? `<button type="button" class="btn btn-secondary view-btn">View</button>
                     <button type="button" class="btn btn-ghost copy-btn">Copy</button>`
                  : `<button type="button" class="btn btn-primary gen-btn">Generate</button>`
              }
            </div>
            <pre class="deliverable hidden"></pre>
          </article>`
              )
              .join("");

      C.mountShell(`
        <section class="section">
          <div class="container" style="max-width:48rem">
            <h1 style="margin:0;font-size:clamp(2rem,4vw,2.75rem)">Desk</h1>
            <p style="margin:.5rem 0 0;color:var(--muted)">Hello ${C.escapeHtml(user.name || user.email)}. Your jobs land here.</p>
            <div style="display:flex;gap:.75rem;margin-top:1.5rem;flex-wrap:wrap">
              <a class="btn btn-primary" href="services.html">New job</a>
              <a class="btn btn-secondary" href="builder.html">Build a site</a>
              <a class="btn btn-ghost" href="settings.html">Settings</a>
            </div>
            <div style="margin-top:2.5rem">${list}</div>
          </div>
        </section>
      `);

      C.qsa(".order-item").forEach((el) => {
        const id = el.dataset.id;
        const order = orders.find((o) => o.id === id);
        const pre = el.querySelector(".deliverable");
        el.querySelector(".view-btn")?.addEventListener("click", () => {
          pre.textContent = order.deliverable || "";
          pre.classList.toggle("hidden");
        });
        el.querySelector(".copy-btn")?.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(order.deliverable || "");
          } catch {}
        });
        el.querySelector(".gen-btn")?.addEventListener("click", () => {
          order.deliverable = C.generateDeliverable(order);
          order.status = "delivered";
          const all = C.getOrders();
          const idx = all.findIndex((o) => o.id === id);
          if (idx >= 0) all[idx] = order;
          C.saveOrders(all);
          location.reload();
        });
      });
    })();
  </script>
</body>
</html>
