<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Tools — Clevora</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
  <div id="app"></div>
  <script src="js/app.js"></script>
  <script>
    (function () {
      const C = window.Clevora;
      const cards = C.TOOLS.map(
        (t) => `
        <a class="card" href="tool.html?slug=${t.slug}">
          <h3>${C.escapeHtml(t.title)}</h3>
          <p>${C.escapeHtml(t.blurb)}</p>
        </a>`
      ).join("");
      C.mountShell(`
        <section class="page-hero">
          <div class="container">
            <h1>Tools</h1>
            <p>Free utilities. No account required. Use them, then commission the desk if you need a full job.</p>
          </div>
        </section>
        <section class="section" style="padding-top:1.5rem">
          <div class="container grid-3" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">${cards}</div>
        </section>
      `);
    })();
  </script>
</body>
</html>
