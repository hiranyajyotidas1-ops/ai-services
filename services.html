<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Services — Clevora</title>
  <meta name="description" content="Nine desks. One checkout. Content, design, websites, research, scripts and growth."/>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
  <div id="app"></div>
  <script src="js/app.js"></script>
  <script>
    (function () {
      const C = window.Clevora;
      const country = C.getPrefs().country;
      const cards = C.SERVICES.map(
        (s) => `
        <a class="card" href="service.html?slug=${s.slug}">
          <div class="card-cat">${C.escapeHtml(s.category)}</div>
          <h3>${C.escapeHtml(s.title)}</h3>
          <p>${C.escapeHtml(s.blurb)}</p>
          <ul class="price-list" style="margin-top:1rem">
            ${s.includes.map((i) => `<li>${C.escapeHtml(i)}</li>`).join("")}
          </ul>
          <div class="card-price">${C.formatPrice(s.priceInr, country)} · ${C.escapeHtml(s.delivery)}</div>
        </a>`
      ).join("");

      C.mountShell(`
        <section class="page-hero">
          <div class="container">
            <h1>Services</h1>
            <p>Nine desks. One checkout. Every offer is a one-time job with a written brief and a file you keep.</p>
          </div>
        </section>
        <section class="section" style="padding-top:1.5rem">
          <div class="container grid-3">${cards}</div>
        </section>
      `);
    })();
  </script>
</body>
</html>
