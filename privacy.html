<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Privacy — Clevora</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
  <div id="app"></div>
  <script src="js/app.js"></script>
  <script>
    window.Clevora.mountShell(`
      <section class="section">
        <div class="container" style="max-width:36rem">
          <h1 style="margin:0;font-size:clamp(2rem,4vw,2.75rem)">Privacy</h1>
          <p style="margin:1.5rem 0 0;color:var(--muted);line-height:1.65">
            We store your account, briefs and deliverables to run the desk. We do not sell personal data. Payments, when live, go through Razorpay — card numbers never touch our servers.
          </p>
          <p style="margin:1rem 0 0;line-height:1.65">
            You can request deletion of your orders and profile. AI generations are produced on demand and saved to your desk until you delete them.
          </p>
        </div>
      </section>
    `);
  </script>
</body>
</html>
