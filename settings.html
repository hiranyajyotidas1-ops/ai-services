<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Settings — Clevora</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
  <div id="app"></div>
  <script src="js/app.js"></script>
  <script>
    (function () {
      const C = window.Clevora;
      const user = C.getUser();
      if (!user) {
        location.href = "login.html?next=settings.html";
        return;
      }
      const prefs = C.getPrefs();
      const countryOpts = C.COUNTRIES.map(
        (c) => `<option value="${c.code}" ${c.code === prefs.country ? "selected" : ""}>${C.escapeHtml(c.name)} · ${c.currency}</option>`
      ).join("");
      const langOpts = C.LANGUAGES.map(
        (l) => `<option value="${l.code}" ${l.code === prefs.language ? "selected" : ""}>${C.escapeHtml(l.label)}</option>`
      ).join("");

      C.mountShell(`
        <section class="section">
          <div class="container" style="max-width:28rem">
            <h1 style="margin:0;font-size:clamp(2rem,4vw,2.75rem)">Settings</h1>
            <p style="margin:.5rem 0 0;font-size:.875rem;color:var(--muted)">${C.escapeHtml(user.email)}</p>
            <div class="field">
              <label>Country / currency</label>
              <select id="country">${countryOpts}</select>
            </div>
            <div class="field">
              <label>Language</label>
              <select id="lang">${langOpts}</select>
            </div>
            <div class="field">
              <label>Theme</label>
              <select id="theme">
                <option value="light" ${prefs.theme === "light" ? "selected" : ""}>Light</option>
                <option value="dark" ${prefs.theme === "dark" ? "selected" : ""}>Dark</option>
              </select>
            </div>
            <p class="success hidden" id="ok" style="margin-top:1rem">Saved.</p>
          </div>
        </section>
      `);

      const save = () => {
        C.setPref("country", C.qs("#country").value);
        C.setPref("language", C.qs("#lang").value);
        C.setPref("theme", C.qs("#theme").value);
        C.qs("#ok").classList.remove("hidden");
      };
      C.qs("#country").addEventListener("change", save);
      C.qs("#lang").addEventListener("change", save);
      C.qs("#theme").addEventListener("change", save);
    })();
  </script>
</body>
</html>
