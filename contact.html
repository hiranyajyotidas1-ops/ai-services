<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Contact — Clevora</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
  <div id="app"></div>
  <script src="js/app.js"></script>
  <script>
    (function () {
      const C = window.Clevora;
      C.mountShell(`
        <section class="section">
          <div class="container" style="max-width:28rem">
            <h1 style="margin:0;font-size:clamp(2rem,4vw,2.75rem)">Contact</h1>
            <p style="margin:.75rem 0 0;color:var(--muted)">India-based desk. We read every note.</p>
            <form id="form" style="margin-top:2rem">
              <div class="field"><label>Name</label><input required name="name"/></div>
              <div class="field"><label>Email</label><input required type="email" name="email"/></div>
              <div class="field"><label>Message</label><textarea required name="msg"></textarea></div>
              <button type="submit" class="btn btn-primary btn-block" style="margin-top:1rem">Send</button>
              <p class="success hidden" id="ok" style="margin-top:1rem">Received. We will reply to the address you entered.</p>
            </form>
          </div>
        </section>
      `);
      C.qs("#form").addEventListener("submit", (e) => {
        e.preventDefault();
        C.qs("#ok").classList.remove("hidden");
        e.target.reset();
      });
    })();
  </script>
</body>
</html>
