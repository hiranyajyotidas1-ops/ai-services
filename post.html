<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Post — Clevora</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
  <div id="app"></div>
  <script src="js/app.js"></script>
  <script>
    (function () {
      const C = window.Clevora;
      const slug = new URLSearchParams(location.search).get("slug") || "";
      const post = C.POSTS.find((p) => p.slug === slug);
      if (!post) {
        C.mountShell(`<section class="page-hero"><div class="container"><h1>Not found</h1><p><a href="blog.html">Journal</a></p></div></section>`);
        return;
      }
      C.mountShell(`
        <article class="section">
          <div class="container" style="max-width:36rem">
            <p class="card-cat">${C.escapeHtml(post.date)}</p>
            <h1 style="margin:.5rem 0 0;font-size:clamp(2rem,4vw,2.75rem)">${C.escapeHtml(post.title)}</h1>
            <p style="margin:1.5rem 0 0;font-size:1.125rem;color:var(--muted)">${C.escapeHtml(post.excerpt)}</p>
            <p style="margin:1.5rem 0 0;line-height:1.65">
              Clevora is a desk, not a feed. We price jobs in rupees first, deliver files you own, and refuse retainers that pretend to be products. The work is the article, the site, the script — not a dashboard of unused credits.
            </p>
            <p style="margin:1rem 0 0;line-height:1.65">
              If you are commissioning a site, write the name, the visitor, and the one action you want. That brief beats a 20-page spec. If you are commissioning copy, say who it is for and what they should do next.
            </p>
          </div>
        </article>
      `);
    })();
  </script>
</body>
</html>
