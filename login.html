<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — AI Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{font-family:'Inter',sans-serif}
.font-display{font-family:'Space Grotesk',sans-serif}
body{background:#07070a;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
.glow-bg{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse 60% 40% at 50% 0%,rgba(99,102,241,.12),transparent);z-index:-1}
.card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(20px)}
.btn-primary{background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 50%,#d946ef 100%);transition:all .3s}
.btn-primary:hover{box-shadow:0 10px 40px rgba(99,102,241,.5);transform:translateY(-2px)}
.input-field{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:14px 18px;color:#fff;width:100%;transition:all .3s;font-size:15px}
.input-field:focus{outline:none;border-color:rgba(99,102,241,.5);background:rgba(99,102,241,.05)}
.input-field::placeholder{color:rgba(255,255,255,.3)}
.gradient-text{background:linear-gradient(135deg,#818cf8 0%,#c084fc 50%,#e879f9 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.float-anim{animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
.google-btn{border:1px solid rgba(255,255,255,.15);transition:all .3s}
.google-btn:hover{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.3)}
</style>
</head>
<body>
<div class="glow-bg"></div>
<div class="w-full max-w-md">
<div class="text-center mb-8">
<div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-indigo-500 to-fuchsia-500 flex items-center justify-center font-bold text-lg float-anim mx-auto mb-4">AI</div>
<h1 class="text-3xl font-display font-bold mb-2">Welcome Back</h1>
<p class="text-gray-400 text-sm">Login to your AI Studio account</p>
</div>
<div class="card rounded-3xl p-8">
<form onsubmit="handleLogin(event)">
<div class="space-y-4">
<div><label class="text-sm text-gray-400 mb-2 block">Email</label><input type="email" name="email" required class="input-field" placeholder="john@example.com"></div>
<div><label class="text-sm text-gray-400 mb-2 block">Password</label><input type="password" name="password" required class="input-field" placeholder="••••••••"></div>
<div class="flex justify-between items-center text-sm"><label class="flex items-center gap-2 text-gray-400 cursor-pointer"><input type="checkbox" class="rounded"> Remember me</label><a href="#" class="text-indigo-400 hover:underline">Forgot password?</a></div>
<button type="submit" class="btn-primary w-full py-4 rounded-2xl font-bold mt-2">Login</button>
</div>
</form>
<div class="my-6 flex items-center gap-3"><div class="flex-1 h-px bg-white/10"></div><span class="text-gray-500 text-xs">OR</span><div class="flex-1 h-px bg-white/10"></div></div>
<button onclick="alert('Google login coming soon! Use email login for now.')" class="google-btn w-full py-3.5 rounded-2xl font-medium text-sm flex items-center justify-center gap-3">
<svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
Continue with Google
</button>
<p class="text-center text-gray-500 text-sm mt-6">New here? <a href="signup.html" class="text-indigo-400 hover:underline font-medium">Create a free account</a></p>
</div>
<div class="text-center mt-6"><a href="index.html" class="text-gray-500 text-sm hover:text-white transition">← Back to home</a></div>
</div>
<script>
function handleLogin(e){
e.preventDefault();
var email=e.target.email.value;
var users=JSON.parse(localStorage.getItem('ai_studio_users')||'[]');
var user=users.find(function(u){return u.email===email});
if(user){localStorage.setItem('ai_current_user',JSON.stringify(user));window.location.href='dashboard.html';}
else{alert('No account found. Please sign up first.');window.location.href='signup.html';}
}
</script>
</body>
</html>
