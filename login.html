<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Sign in — Clevora</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
  <div id="app"></div>
  <script src="js/app.js"></script>
  <script>
    (function () {
      const C = window.Clevora;
      if (C.getUser()) {
        location.href = "dashboard.html";
        return;
      }
      C.mountShell(`
        <div class="auth-box">
          <h1>Sign in</h1>
          <p class="sub">New here? <a href="signup.html">Create an account</a></p>
          <div class="auth-stack">
            <form id="form">
              <div class="field"><label>Email</label><input type="email" id="email" required/></div>
              <div class="field"><label>Password</label><input type="password" id="password" required minlength="6"/></div>
              <p class="error hidden" id="err"></p>
              <button type="submit" class="btn btn-primary btn-block" style="margin-top:1rem">Sign in</button>
            </form>
            <p style="font-size:.75rem;color:var(--subtle);margin:0">Demo auth stores accounts in this browser only. Connect Supabase Auth for production.</p>
          </div>
        </div>
      `);
      C.qs("#form").addEventListener("submit", (e) => {
        e.preventDefault();
        const email = C.qs("#email").value.trim().toLowerCase();
        const password = C.qs("#password").value;
        const accounts = JSON.parse(localStorage.getItem("clevora-accounts") || "{}");
        if (!accounts[email] || accounts[email].password !== password) {
          C.qs("#err").textContent = "Invalid email or password";
          C.qs("#err").classList.remove("hidden");
          return;
        }
        C.setUser({ email, name: accounts[email].name || email.split("@")[0] });
        const next = new URLSearchParams(location.search).get("next") || "dashboard.html";
        location.href = next;
      });
    })();
  </script>
</body>
</html>
