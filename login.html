<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — Clevora</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{font-family:'Inter',sans-serif;box-sizing:border-box}
.fd{font-family:'Space Grotesk',sans-serif}
:root{--bg:#f8fafc;--card:rgba(255,255,255,.8);--text:#0f172a;--muted:#64748b;--border:rgba(0,0,0,.06)}
[data-theme="dark"]{--bg:#0f172a;--card:rgba(30,41,59,.6);--text:#f1f5f9;--muted:#94a3b8;--border:rgba(255,255,255,.08)}
body{background:linear-gradient(135deg,var(--bg) 0%,#eef2ff 50%,var(--bg) 100%);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;transition:background .3s}
.glow{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse 60% 40% at 50% 0%,rgba(99,102,241,.08),transparent);z-index:-1;pointer-events:none}
.card{background:var(--card);backdrop-filter:blur(16px);border:1px solid var(--border);box-shadow:0 4px 32px rgba(0,0,0,.04)}
.btn{background:linear-gradient(135deg,#6366f1,#8b5cf6,#d946ef);color:#fff;transition:all .3s;cursor:pointer;border:none}
.btn:hover{box-shadow:0 8px 32px rgba(99,102,241,.3);transform:translateY(-2px)}
.input{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:14px 18px;color:var(--text);width:100%;transition:all .3s;font-size:15px;box-sizing:border-box}
.input:focus{outline:none;border-color:#6366f1;background:#fff;box-shadow:0 0 0 3px rgba(99,102,241,.1)}
.fa{animation:fl 6s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.link{color:#6366f1;text-decoration:none;transition:color .2s}
.link:hover{color:#4f46e5;text-decoration:underline}
</style>
</head>
<body>
<div class="glow"></div>
<div class="w-full max-w-md">
<div class="text-center mb-8">
<div class="w-14 h-14 rounded-2xl flex items-center justify-center font-bold text-lg fa mx-auto mb-4" style="background:linear-gradient(135deg,#6366f1,#8b5cf6,#d946ef);color:#fff">C</div>
<h1 class="text-3xl fd font-bold mb-2">Welcome Back</h1>
<p class="text-sm" style="color:var(--muted)">Login to your Clevora account</p>
</div>
<div class="card rounded-3xl p-6 sm:p-8">
<form id="loginForm" onsubmit="return handleLogin(event)">
<div class="space-y-4">
<div><label class="text-sm font-medium mb-2 block" style="color:var(--muted)">Email</label><input type="email" id="email" required class="input" placeholder="john@example.com"></div>
<div><label class="text-sm font-medium mb-2 block" style="color:var(--muted)">Password</label><input type="password" id="password" required class="input" placeholder="Your password"></div>
<div id="error-msg" style="color:#ef4444;font-size:13px;margin-top:8px;display:none;padding:8px 12px;border-radius:8px;background:rgba(239,68,68,.05);border:1px solid rgba(239,68,68,.1)"></div>
<button type="submit" id="submit-btn" class="btn w-full py-4 rounded-2xl font-bold mt-2">Login</button>
</div>
</form>
<p class="text-center text-sm mt-4" style="color:var(--muted)">Don't have an account? <a href="signup.html" class="link font-medium">Sign Up Free</a></p>
</div>
<div class="text-center mt-6"><a href="index.html" class="text-sm" style="color:#94a3b8">Back to home</a></div>
</div>
<script>
function handleLogin(e){
e.preventDefault();
var btn=document.getElementById('submit-btn');
var errEl=document.getElementById('error-msg');
errEl.style.display='none';
btn.disabled=true;btn.textContent='Logging in...';
var email=document.getElementById('email').value.trim().toLowerCase();
var password=document.getElementById('password').value;
var user=JSON.parse(localStorage.getItem('clevora_user')||'null');
if(user&&user.email===email){
window.location.href='dashboard.html';
}else{
errEl.textContent='Account not found. Please sign up first.';
errEl.style.display='block';
btn.disabled=false;btn.textContent='Login';
}
return false;
}
var t=localStorage.getItem('clevora_theme')||'light';document.documentElement.setAttribute('data-theme',t);
</script>
</body>
</html>
