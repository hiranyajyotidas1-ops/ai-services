<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Sign up — Clevora</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
  <div id="app"></div>
  <script src="js/app.js"></script>
  <script>
    (function () {
      const C = window.Clevora;
      if (C.getUser()) {
        location.href = "dashboard.html";
        return;
      }
      C.mountShell(`
        <div class="auth-box">
          <h1>Create account</h1>
          <p class="sub">Already have one? <a href="login.html">Sign in</a></p>
          <div class="auth-stack">
            <form id="form">
              <div class="field"><label>Name</label><input id="name" required/></div>
              <div class="field"><label>Email</label><input type="email" id="email" required/></div>
              <div class="field"><label>Password (6+)</label><input type="password" id="password" required minlength="6"/></div>
              <p class="error hidden" id="err"></p>
              <button type="submit" class="btn btn-primary btn-block" style="margin-top:1rem">Create account</button>
            </form>
          </div>
        </div>
      `);
      C.qs("#form").addEventListener("submit", (e) => {
        e.preventDefault();
        const name = C.qs("#name").value.trim();
        const email = C.qs("#email").value.trim().toLowerCase();
        const password = C.qs("#password").value;
        const accounts = JSON.parse(localStorage.getItem("clevora-accounts") || "{}");
        if (accounts[email]) {
          C.qs("#err").textContent = "Account already exists. Sign in instead.";
          C.qs("#err").classList.remove("hidden");
          return;
        }
        accounts[email] = { name, password };
        localStorage.setItem("clevora-accounts", JSON.stringify(accounts));
        C.setUser({ email, name });
        location.href = "dashboard.html";
      });
    })();
  </script>
</body>
</html>
