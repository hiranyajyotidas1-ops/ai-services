<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Journal — Clevora</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
  <div id="app"></div>
  <script src="js/app.js"></script>
  <script>
    (function () {
      const C = window.Clevora;
      const posts = C.POSTS.map(
        (p) => `
        <a href="post.html?slug=${p.slug}" style="display:block;border-bottom:1px solid var(--border);padding:0 0 2rem;margin-bottom:2rem">
          <div class="card-cat">${C.escapeHtml(p.date)}</div>
          <h2 style="margin:.5rem 0 0;font-size:1.5rem">${C.escapeHtml(p.title)}</h2>
          <p style="margin:.5rem 0 0;color:var(--muted);font-size:.875rem">${C.escapeHtml(p.excerpt)}</p>
        </a>`
      ).join("");
      C.mountShell(`
        <section class="page-hero">
          <div class="container" style="max-width:40rem">
            <h1>Journal</h1>
          </div>
        </section>
        <section class="section" style="padding-top:1rem">
          <div class="container" style="max-width:40rem">${posts}</div>
        </section>
      `);
    })();
  </script>
</body>
</html>
